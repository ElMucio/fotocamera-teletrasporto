[project]
name = "teletrasporto"
version = "0.1.0"
description = "Fotocamera virtuale con gesti: teletrasporto e loop"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe==0.10.14",
    "opencv-python>=4.10",
    "numpy>=1.26,<2.3",
    "PySide6-Essentials>=6.7",
    "pygrabber>=0.2",
]

[dependency-groups]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teletrasporto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
